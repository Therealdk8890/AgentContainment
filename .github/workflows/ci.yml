name: AgentContain CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    name: Unit and adapter tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ./AgentContainment
      - run: python -m pip install -e .
      - run: python -m pip install pytest
      - run: python -m pytest -q tests -m "not integration"

  interleave-security:
    name: Controlled interleaving security model
    runs-on: ubuntu-latest
    needs: unit
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ./AgentContainment
      - run: python -m pip install -e .
      - run: python -m pip install pytest git+https://github.com/Therealdk8890/interleave-test.git
      - run: python -m pytest -q tests/test_interleave_scheduler_security_model.py

  host-integration:
    name: Linux cgroup-v2 workload proof
    runs-on: ubuntu-latest
    needs: unit
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ./AgentContainment
      - run: python -m pip install -e .
      - run: python -m pip install pytest
      - name: Inspect host boundary
        run: |
          uname -a
          stat -fc %T /sys/fs/cgroup
          test -f /sys/fs/cgroup/cgroup.controllers
          id
      - name: Run real workload containment proof
        env:
          AGENT_CONTAIN_RUN_REAL_CGROUP: "1"
        run: |
          sudo -E "$pythonLocation/bin/python" -m pytest -q tests/integration/test_real_cgroup_execution.py
