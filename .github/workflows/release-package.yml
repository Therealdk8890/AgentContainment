name: Release Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Smoke test wheel installation
        run: |
          python -m venv /tmp/agentcontainment-release-test
          /tmp/agentcontainment-release-test/bin/python -m pip install dist/*.whl
          /tmp/agentcontainment-release-test/bin/python -c "import agent_containment; print(agent_containment.__file__)"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: agentcontainment-dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: agentcontainment-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
