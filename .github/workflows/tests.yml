name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install pytest
      - run: PYTHONPATH=src pytest -q

  ebpf-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install eBPF build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libbpf-dev pkg-config
      - name: Build eBPF containment controller
        run: bash scripts/build_ebpf.sh

  # This job uses sudo and is intentionally restricted to pushes to the
  # repository. Never execute privileged test code from untrusted PRs/forks.
  ebpf-privileged-integration:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linux eBPF dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libbpf-dev pkg-config
      - name: Build eBPF containment controller
        run: bash scripts/build_ebpf.sh
      - name: Install Python test dependencies
        run: python -m pip install pytest
      - name: Run privileged containment adversarial tests
        run: sudo env AGENT_CONTAINMENT_RUN_PRIVILEGED_TESTS=1 PYTHONPATH=src PATH="$PATH" pytest -q tests/integration/test_linux_ebpf.py
