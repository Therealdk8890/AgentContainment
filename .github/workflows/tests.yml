name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - run: python -m pip install pytest
      - name: Run test suite with a hard timeout and verbose progress
        run: timeout --signal=TERM --kill-after=10s 120s pytest -vv

  regression-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install . pytest
      - name: Replay incident-derived regression fixtures
        run: PYTHONPATH=src python -m pytest -q tests/test_regression.py tests/test_regression_replay.py tests/test_epoch_fencing_adversarial.py
      - name: Verify adversarial epoch-fencing proof is part of the regression gate
        run: PYTHONPATH=src python -m pytest -q tests/test_epoch_fencing_adversarial.py
      - name: Verify fixture files are valid JSON
        run: python -m json.tool tests/fixtures/regression/secret-exfiltration.json >/dev/null

  ebpf-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install eBPF build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libbpf-dev pkg-config
      - name: Build eBPF containment controller
        run: bash scripts/build_ebpf.sh

  # This job uses sudo and is intentionally restricted to pushes to the
  # repository. A maintainer-controlled branch push is the trusted path for
  # exercising the real-host boundary; never execute privileged test code
  # from untrusted PRs/forks.
  ebpf-privileged-integration:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linux eBPF dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libbpf-dev pkg-config
      - name: Build eBPF containment controller
        run: bash scripts/build_ebpf.sh
      - name: Install package and test dependencies
        run: python -m pip install . pytest
      - name: Capture trusted host and privilege context
        run: |
          {
            echo "=== identity ==="
            id
            echo "=== kernel ==="
            uname -a
            echo "=== cgroup ==="
            stat -fc '%T' /sys/fs/cgroup
            cat /sys/fs/cgroup/cgroup.controllers
          } | sudo tee privileged-integration.log
      - name: Run trusted privileged containment, isolation, and kernel egress adversarial tests
        run: |
          set -o pipefail
          sudo env AGENT_CONTAINMENT_RUN_PRIVILEGED_TESTS=1 PYTHONPATH=src PATH="$PATH"             pytest -q -rs tests/integration/test_linux_ebpf.py tests/integration/test_controller_isolation.py tests/integration/test_cgroup_delegation.py             2>&1 | sudo tee -a privileged-integration.log
      - name: Upload privileged integration receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privileged-containment-integration-receipt
          path: privileged-integration.log
          if-no-files-found: error
          retention-days: 90
