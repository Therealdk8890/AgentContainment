name: hermetic-security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hermetic-failure-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install . pytest hermetic-sandbox
      - run: python -m pytest -q tests/test_hermetic_failure_replay.py
