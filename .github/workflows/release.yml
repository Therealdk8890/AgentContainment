name: release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and validate release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Validate release tag matches package version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as project_file:
              package_version = tomllib.load(project_file)["project"]["version"]

          expected_tag = f"v{package_version}"
          actual_tag = os.environ["RELEASE_TAG"]
          if actual_tag != expected_tag:
              raise SystemExit(
                  f"Release tag mismatch: tag is {actual_tag!r}, "
                  f"but pyproject.toml declares {package_version!r}; "
                  f"expected tag {expected_tag!r}."
              )

          print(f"Release tag {actual_tag} matches package version {package_version}.")
          PY

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Smoke-test wheel installation
        run: |
          python -m venv /tmp/agentcontainment-release-test
          /tmp/agentcontainment-release-test/bin/python -m pip install dist/*.whl
          /tmp/agentcontainment-release-test/bin/python -c "import agent_containment; print(agent_containment.__file__)"

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agentcontainment-${{ github.ref_name }}
          path: dist/

  check-pypi:
    name: Check PyPI publication state
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.check.outputs.published }}
    steps:
      - name: Check whether this version is already on PyPI
        id: check
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import urllib.error
          import urllib.request

          version = os.environ["VERSION"].removeprefix("v")
          url = f"https://pypi.org/pypi/agentcontainment/{version}/json"

          try:
              with urllib.request.urlopen(url, timeout=10) as response:
                  published = response.status == 200
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  published = False
              else:
                  raise

          print(f"PyPI version {version}: {'already published' if published else 'not published'}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"published={'true' if published else 'false'}\n")
          PY

  publish:
    name: Publish to PyPI
    needs: check-pypi
    if: github.event_name == 'push' && github.ref_type == 'tag' && needs.check-pypi.outputs.published != 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: agentcontainment-${{ github.ref_name }}
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  already-published:
    name: PyPI already contains this version
    needs: check-pypi
    if: github.event_name == 'push' && github.ref_type == 'tag' && needs.check-pypi.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Record successful idempotent release
        run: echo "agentcontainment ${{ github.ref_name }} is already published on PyPI; nothing to upload."
