name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build and validate release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Smoke-test wheel installation
        run: |
          python -m venv /tmp/agentcontainment-release-test
          /tmp/agentcontainment-release-test/bin/python -m pip install dist/*.whl
          /tmp/agentcontainment-release-test/bin/python -c "import agent_containment; print(agent_containment.__file__)"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: agentcontainment-${{ github.ref_name }}
          path: dist/

  check-pypi:
    name: Check PyPI publication state
    needs: build
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.check.outputs.published }}
    steps:
      - name: Check whether this version is already on PyPI
        id: check
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import urllib.error
          import urllib.request

          version = os.environ["VERSION"].removeprefix("v")
          url = f"https://pypi.org/pypi/agentcontainment/{version}/json"

          try:
              with urllib.request.urlopen(url, timeout=10) as response:
                  published = response.status == 200
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  published = False
              else:
                  raise

          print(f"PyPI version {version}: {'already published' if published else 'not published'}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"published={'true' if published else 'false'}\n")
          PY

  publish:
    name: Publish to PyPI
    needs: check-pypi
    if: needs.check-pypi.outputs.published != 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: agentcontainment-${{ github.ref_name }}
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  already-published:
    name: PyPI already contains this version
    needs: check-pypi
    if: needs.check-pypi.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Record successful idempotent release
        run: echo "agentcontainment ${{ github.ref_name }} is already published on PyPI; nothing to upload."
